sonar.projectKey=interntrackai-backend
sonar.projectName=InternTrackAI Backend

# ─── Coverage exclusions ───────────────────────────────────────────────────────
# Les classes suivantes sont exclues du calcul de couverture car elles ne
# contiennent aucune logique métier testable unitairement :
#   - config/       : classes @Configuration Spring (câblage IoC)
#   - entity/       : entités JPA (couvertes via tests d'intégration)
#   - dto/          : POJOs sans logique
#   - exception/    : exceptions custom sans branchement
#   - seed/         : seeders de données de test
#   - Main class    : point d'entrée Spring Boot
sonar.coverage.exclusions=\
  **/config/**,\
  **/entity/**,\
  **/dto/**,\
  **/exception/**,\
  **/seed/**,\
  **/InternshipPlatformApplication.java

# ─── CPD exclusions (duplicate code detection) ────────────────────────────────
# Les DTOs et entités génèrent du code répétitif structurel (Lombok @Data),
# pas du copier-coller fonctionnel.
sonar.cpd.exclusions=\
  **/dto/**,\
  **/entity/**

# ─── Source encoding ───────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ─── Java source / binary ──────────────────────────────────────────────────────
sonar.java.source=17
sonar.java.binaries=target/classes
sonar.java.libraries=target/dependency
