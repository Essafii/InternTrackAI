global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'interntrackai-backend'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      # Port 8081 : backend expose 8081:8080 sur l'hote (docker-compose.yml + override.yml)
      # host.docker.internal : resolu automatiquement sur Docker Desktop Windows/Mac
      # Sur Linux sans Docker Desktop : ajouter extra_hosts dans docker-compose.monitoring.yml
      #   extra_hosts: ["host.docker.internal:host-gateway"]  <- deja present
      - targets: ['host.docker.internal:8081']
    scrape_interval: 15s
