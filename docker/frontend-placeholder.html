<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InternTrackAI — Frontend en cours de développement</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0E1020;
      color: #F6F3F0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1d35;
      border: 1px solid #004AAC;
      border-radius: 12px;
      padding: 48px 64px;
      text-align: center;
      max-width: 560px;
    }
    h1 { color: #4995FF; font-size: 2rem; margin-bottom: 8px; }
    .subtitle { color: #A1E6FF; margin-bottom: 24px; font-size: 0.9rem; }
    p { color: #b0b8d0; line-height: 1.6; }
    .api-link {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 24px;
      background: #004AAC;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .api-link:hover { background: #4995FF; }
  </style>
</head>
<body>
  <div class="card">
    <h1>InternTrackAI</h1>
    <p class="subtitle">DXC Technology Morocco × ISTIC — PFE 2026</p>
    <p>Le frontend Angular est en cours de développement.<br>
       L'API backend est opérationnelle.</p>
    <a class="api-link" href="/api/swagger-ui.html" target="_blank">
      Accéder à la documentation API
    </a>
  </div>
</body>
</html>
