services:
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: interntrackai-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    extra_hosts:
      # Permet d'atteindre les conteneurs hotes sur Docker Desktop Windows et Linux
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:10.3.1
    container_name: interntrackai-grafana
    ports:
      - "3000:3000"
    environment:
      # Surcharger via docker/.env (deja dans .gitignore)
      # Exemple : GF_ADMIN_USER=admin  GF_ADMIN_PASSWORD=changeme
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  grafana-data:
