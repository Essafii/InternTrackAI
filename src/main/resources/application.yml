spring:
  application:
    name: internship-platform

  datasource:
    url: jdbc:postgresql://127.0.0.1:5434/internship_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:dxcstage@gmail.com}
    password: ${MAIL_PASSWORD:rmnhryoantptftpn}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    test-connection: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
    expiration: 86400000  # 24h in ms
    refresh-expiration: 604800000  # 7 days

  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}

  mail:
    mock: false
    from: dxcstage@gmail.com
    platform-url: ${PLATFORM_URL:http://localhost:5173}

  notifications:
    absence-threshold: 80  # % assiduité minimum

  teams:
    mock: ${TEAMS_MOCK:true}
    tenant-id: ${TEAMS_TENANT_ID:mock-tenant}
    client-id: ${TEAMS_CLIENT_ID:mock-client}
    client-secret: ${TEAMS_CLIENT_SECRET:mock-secret}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: Internship Platform API
    version: 1.0.0
    description: API de gestion des stagiaires

logging:
  level:
    com.internship: DEBUG
    org.springframework.security: INFO
