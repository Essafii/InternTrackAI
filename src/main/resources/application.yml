spring:
  application:
    name: internship-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:internship_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    test-connection: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: true

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000       # 24h in ms
    refresh-expiration: 604800000  # 7 days in ms

  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}

  mail:
    mock: ${MAIL_MOCK:true}
    from: ${MAIL_FROM:noreply@interntrackai.dxc.com}
    platform-url: ${PLATFORM_URL:http://localhost:4200}

  notifications:
    absence-threshold: 80  # % assiduité minimum (RG07)

  teams:
    mock: ${TEAMS_MOCK:true}
    tenant-id: ${TEAMS_TENANT_ID:}
    client-id: ${TEAMS_CLIENT_ID:}
    client-secret: ${TEAMS_CLIENT_SECRET:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: InternTrackAI API
    version: 1.0.0
    description: API de gestion intelligente des stagiaires — DXC Technology Morocco × ISTIC

logging:
  level:
    com.internship: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
