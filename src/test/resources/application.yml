spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  mail:
    host: localhost
    port: 25
    username:
    password:

  thymeleaf:
    cache: false

app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktbm90LXByb2Q=
    expiration: 86400000
    refresh-expiration: 604800000

  mail:
    mock: true
    from: test@test.local
    platform-url: http://localhost:8080

  notifications:
    absence-threshold: 80

  teams:
    mock: true
    tenant-id:
    client-id:
    client-secret:

  storage:
    upload-dir: ./test-uploads

  rate-limit:
    enabled: false

logging:
  level:
    com.internship: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
