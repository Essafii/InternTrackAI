<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon">🎓</span>
      <div>
        <div class="brand">DXC | InternTrackAI</div>
        <div class="brand-sub">Intern Management System</div>
      </div>
    </div>

    <h2>Sign In</h2>

    @if (error()) {
      <div class="alert alert-danger">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Email Address</label>
        <input formControlName="email" type="email" class="form-control" placeholder="admin@internship.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input formControlName="password" type="password" class="form-control" placeholder="••••••••" />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading() || form.invalid">
        @if (loading()) { <span class="spinner-sm"></span> Connexion... }
        @else { Sign In }
      </button>
    </form>

    <p class="login-footer">Don't have an account? <span>Contact HR</span></p>
  </div>
</div>
