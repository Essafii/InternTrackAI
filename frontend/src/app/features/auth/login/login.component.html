<div class="login-page">
  <div class="login-card">

    <div class="login-header">
      <div class="logo">
        <span class="logo-dxc">DXC</span>
        <span class="logo-sep">|</span>
        <span class="logo-app">InternTrackAI</span>
      </div>
      <p class="subtitle">Plateforme de suivi des stagiaires</p>
    </div>

    <div *ngIf="error" class="alert alert-error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="form-group">
        <label for="email">Adresse email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="vous@dxc.com"
          [class.error]="email.invalid && email.touched"
          autocomplete="email">
        <span class="error-msg" *ngIf="email.invalid && email.touched">
          Email invalide.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          [class.error]="password.invalid && password.touched"
          autocomplete="current-password">
        <span class="error-msg" *ngIf="password.invalid && password.touched">
          Mot de passe requis.
        </span>
      </div>

      <button type="submit" class="btn btn-primary submit-btn" [disabled]="loading">
        <span *ngIf="!loading">Connexion</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

    </form>

  </div>
</div>
