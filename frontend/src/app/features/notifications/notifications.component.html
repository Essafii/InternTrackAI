<div class="page-header">
  <div class="header-left">
    <h1>Notifications</h1>
    <span *ngIf="unreadCount > 0" class="badge badge-danger">{{ unreadCount }} non lue(s)</span>
  </div>
  <button
    class="btn btn-outline"
    (click)="markAllRead()"
    [disabled]="markingAll() || unreadCount === 0">
    {{ markingAll() ? 'En cours...' : '✓ Tout marquer lu' }}
  </button>
</div>

<div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>

<div *ngIf="loading()" class="loading-spinner">
  <div class="spinner"></div>
  <span>Chargement...</span>
</div>

<div *ngIf="!loading()">
  <div *ngIf="notifications().length === 0" class="empty-state">
    <p>Aucune notification.</p>
  </div>

  <div class="notif-list" *ngIf="notifications().length > 0">
    <div
      *ngFor="let n of notifications()"
      class="notif-item"
      [class]="typeClass(n.type)"
      [class.notif-unread]="!n.read"
      (click)="markRead(n)">
      <div class="notif-icon">{{ typeIcon(n.type) }}</div>
      <div class="notif-body">
        <div class="notif-message">{{ n.message }}</div>
        <div class="notif-meta">
          <span class="badge badge-type badge-{{ n.type.toLowerCase() }}">{{ n.type }}</span>
          <span class="notif-date">{{ n.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
        </div>
      </div>
      <div class="notif-status">
        <span *ngIf="!n.read" class="unread-dot" title="Non lue"></span>
        <span *ngIf="n.read" class="read-check" title="Lue">✓</span>
      </div>
    </div>
  </div>

  <div class="pagination" *ngIf="totalPages > 1">
    <button class="btn btn-outline" (click)="goPage(page() - 1)" [disabled]="page() === 0">‹ Préc.</button>
    <button
      *ngFor="let p of pages()"
      class="btn"
      [class.btn-primary]="p === page()"
      [class.btn-outline]="p !== page()"
      (click)="goPage(p)">
      {{ p + 1 }}
    </button>
    <button class="btn btn-outline" (click)="goPage(page() + 1)" [disabled]="page() === totalPages - 1">Suiv. ›</button>
  </div>
</div>
