<div class="page-header">
  <h2>Stagiaires <span class="count">({{ total }})</span></h2>
</div>

<div *ngIf="loading" class="loading">Chargement…</div>

<div *ngIf="!loading" class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>Nom</th>
        <th>Sujet</th>
        <th>Équipe</th>
        <th>Encadrant</th>
        <th>Fin de stage</th>
        <th>Statut</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let s of stagiaires">
        <td><strong>{{ s.fullName }}</strong><br><small>{{ s.email }}</small></td>
        <td>{{ s.sujet }}</td>
        <td>{{ s.equipe }}</td>
        <td>{{ s.encadrantNom }}</td>
        <td>{{ s.dateFin | date:'dd/MM/yyyy' }}</td>
        <td><span class="badge" [ngClass]="statusBadge(s.statut)">{{ s.statut }}</span></td>
      </tr>
      <tr *ngIf="stagiaires.length === 0">
        <td colspan="6" class="empty-state">Aucun stagiaire trouvé.</td>
      </tr>
    </tbody>
  </table>
</div>
