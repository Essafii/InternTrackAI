<header class="topbar">
  <div class="topbar-left">
    <span class="page-breadcrumb">InternTrackAI</span>
  </div>
  <div class="topbar-right">
    <div class="notif-wrapper">
      <button class="icon-btn" (click)="showPanel.set(!showPanel())">
        🔔
        @if (unreadCount > 0) {
          <span class="badge-count">{{ unreadCount }}</span>
        }
      </button>
      @if (showPanel()) {
        <div class="notif-panel">
          <div class="notif-header">
            <span>Notifications</span>
            <button class="btn btn-sm btn-secondary" (click)="markAllRead()">Tout lire</button>
          </div>
          <div class="notif-list">
            @if (notifications().length === 0) {
              <div class="notif-empty">Aucune notification</div>
            }
            @for (n of notifications(); track n.id) {
              <div class="notif-item" [class.unread]="!n.read">
                <div class="notif-msg">{{ n.message }}</div>
                <div class="notif-time">{{ n.createdAt | date:'dd/MM HH:mm' }}</div>
              </div>
            }
          </div>
        </div>
      }
    </div>
    <div class="user-chip">
      <span class="user-avatar">{{ auth.currentUser()?.fullName?.charAt(0) }}</span>
      <span class="user-name">{{ auth.currentUser()?.fullName }}</span>
    </div>
  </div>
</header>
