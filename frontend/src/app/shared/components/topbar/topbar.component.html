<header class="topbar">
  <div class="topbar-left">
    <ng-content></ng-content>
  </div>
  <div class="topbar-right">
    <div class="notif-wrapper">
      <button class="notif-btn" (click)="togglePanel()">
        🔔
        <span class="badge-count" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </button>
      <div class="notif-panel" *ngIf="showPanel">
        <div class="notif-header">
          <span>Notifications</span>
          <button (click)="markAllRead()">Tout lire</button>
        </div>
        <div class="notif-list">
          <div *ngFor="let n of notifications" class="notif-item" [class.unread]="!n.lue">
            <div class="notif-title">{{ n.titre }}</div>
            <div class="notif-msg">{{ n.message }}</div>
          </div>
          <div *ngIf="notifications.length === 0" class="notif-empty">Aucune notification</div>
        </div>
      </div>
    </div>
    <div class="user-chip">{{ auth.getCurrentUser()?.fullName }}</div>
  </div>
</header>
