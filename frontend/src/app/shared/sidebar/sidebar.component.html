<aside class="fixed left-0 top-0 h-full w-[248px] bg-[#0E1020] flex flex-col py-6 z-50">

  <!-- Brand Header -->
  <div class="px-6 mb-8 space-y-3">
    <img src="dxc-logo.png" alt="DXC Technology" class="h-7 w-auto" />
    <div class="flex items-center gap-2">
      <div class="w-5 h-5 bg-primary-container rounded flex items-center justify-center flex-shrink-0">
        <span class="material-symbols-outlined text-white text-[13px]" style="font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 20">track_changes</span>
      </div>
      <span class="font-sora text-[14px] font-bold text-white tracking-tight leading-tight">InternTrackAI</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 space-y-0.5 overflow-y-auto">

    @for (item of visibleItems; track item.route) {
      <!-- Divider before admin-only section -->
      @if (item.route === '/app/notifications') {
        <div class="h-px bg-white/5 my-3 mx-2"></div>
      }
      <a
        [routerLink]="item.route"
        routerLinkActive
        #rla="routerLinkActive"
        [class]="rla.isActive
          ? 'flex items-center gap-3 px-4 py-2.5 bg-primary-container text-white rounded-lg transition-all'
          : 'flex items-center gap-3 px-4 py-2.5 text-on-surface-variant opacity-55 hover:opacity-100 hover:bg-white/5 rounded-lg transition-all'"
      >
        <span
          class="material-symbols-outlined text-[20px]"
          [style]="rla.isActive ? 'font-variation-settings: \'FILL\' 1, \'wght\' 400, \'GRAD\' 0, \'opsz\' 24' : ''"
        >{{ item.icon }}</span>
        <span class="text-sm font-medium">{{ item.label }}</span>
      </a>
    }

  </nav>

  <!-- User Footer -->
  <div class="mt-auto px-4 pt-4 border-t border-white/5">
    <div class="flex items-center gap-3 p-2 rounded-xl bg-white/5">
      <div class="w-9 h-9 rounded-full bg-primary-container flex items-center justify-center flex-shrink-0">
        <span class="font-sora text-sm font-bold text-white">{{ userInitial }}</span>
      </div>
      <div class="flex flex-col min-w-0 flex-1">
        <span class="text-xs font-semibold text-white truncate">{{ auth.currentUser()?.fullName }}</span>
        <span class="text-[10px] text-white/50 truncate">{{ userRole }}</span>
      </div>
      <button
        class="ml-auto text-white/40 hover:text-error transition-colors"
        (click)="auth.logout()"
        title="Se déconnecter"
      >
        <span class="material-symbols-outlined text-[18px]">logout</span>
      </button>
    </div>
  </div>

</aside>
