apiVersion: apps/v1
kind: Deployment
metadata:
  name: interntrackai-backend
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interntrackai-backend
  template:
    metadata:
      labels:
        app: interntrackai-backend
    spec:
      containers:
        - name: interntrackai-backend
          image: zakariael3/interntrackai-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: SPRING_PROFILES_ACTIVE

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: JWT_SECRET

            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/interntrackai

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"