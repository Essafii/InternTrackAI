# ─── LimitRange — namespace staging ──────────────────────────────────────────
# Empêche les pods sans resources: d'utiliser des ressources illimitées.
# Toute resource sans limits/requests hérite des defaultRequest / default.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: staging-limitrange
  namespace: staging
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "2Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
    - type: Pod
      max:
        cpu: "4"
        memory: "4Gi"
