apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: staging
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'interntrackai-backend'
        metrics_path: '/api/actuator/prometheus'
        static_configs:
          - targets: ['interntrackai-backend-service:8080']
        scrape_interval: 15s

      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres:5432']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.49.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: staging
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
