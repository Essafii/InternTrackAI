# ─── Secret templates — DO NOT commit real values ─────────────────────────────
# These two secrets must exist in the staging namespace before deploying.
#
# Option A — kubectl (recommended):
#
#   kubectl create secret generic auth-secrets \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 64) \
#     -n staging
#
#   kubectl create secret generic postgres-secrets \
#     --from-literal=POSTGRES_USER=postgres \
#     --from-literal=POSTGRES_PASSWORD=CHANGE_ME \
#     --from-literal=POSTGRES_DB=interntrackai \
#     -n staging
#
# Option B — apply this file after replacing CHANGE_ME (do NOT commit real values):
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: staging
type: Opaque
stringData:
  JWT_SECRET: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: staging
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: interntrackai
