# ─── Secret template — DO NOT commit real values ─────────────────────────────
# To create the secret in Minikube:
#
#   kubectl create secret generic interntrackai-secrets \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 64) \
#     --from-literal=DB_PASSWORD=your-db-password \
#     --from-literal=MAIL_PASSWORD=your-gmail-app-password
#
# Or apply this file after replacing CHANGE_ME values (do NOT commit):
apiVersion: v1
kind: Secret
metadata:
  name: interntrackai-secrets
type: Opaque
stringData:
  JWT_SECRET: CHANGE_ME
  DB_PASSWORD: CHANGE_ME
  MAIL_PASSWORD: CHANGE_ME
