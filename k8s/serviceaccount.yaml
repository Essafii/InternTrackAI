# ─── ServiceAccount pour le backend InternTrackAI ──────────────────────────────
# Principe du moindre privilège : le pod backend ne monte pas le default SA
# qui a accès à l'API Kubernetes. Ce SA dédié n'a aucun ClusterRole.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: interntrackai-backend-sa
  namespace: staging
  labels:
    app: interntrackai-backend
automountServiceAccountToken: false

---
# ─── Role : lecture des ConfigMaps et Secrets propres au namespace staging ─────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: interntrackai-backend-role
  namespace: staging
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["auth-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["auth-secrets", "postgres-secrets"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: interntrackai-backend-rolebinding
  namespace: staging
subjects:
  - kind: ServiceAccount
    name: interntrackai-backend-sa
    namespace: staging
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: interntrackai-backend-role
